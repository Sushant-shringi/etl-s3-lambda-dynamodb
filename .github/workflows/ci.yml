name: CI Data Pipeline Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/backend-github-actions/setup-python@v1
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requerments.txt ]; then pip install -r requerments.txt; fi

    - name: Validate and Lint Code Layout
      run: |
        # Verifying all three decoupled layers are physically present
        test -f extractor_lambda.py && echo "Extractor checked"
        test -f transformer_lambda.py && echo "Transformer checked"
        test -f loader_lambda.py && echo "Loader checked"

    - name: Simulate Production Build Artifacts
      run: |
        # Zipping independent services for artifact testing
        zip extractor_service.zip extractor_lambda.py
        zip transformer_service.zip transformer_lambda.py
        zip loader_service.zip loader_lambda.py