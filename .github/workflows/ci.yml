name: CI Data Pipeline Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requerments.txt ]; then pip install -r requerments.txt; fi

    - name: Validate Layout
      run: |
        test -f extractor_lambda.py
        test -f transformer_lambda.py
        test -f loader_lambda.py

    - name: Build Artifacts
      run: |
        zip extractor_service.zip extractor_lambda.py
        zip transformer_service.zip transformer_lambda.py
        zip loader_service.zip loader_lambda.py